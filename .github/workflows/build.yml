name: Deploy personal site

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types:
      - notes-updated
  schedule:
    # 每天 04:17（北京时间）同步一次笔记仓库。
    - cron: "17 20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal site
        uses: actions/checkout@v4

      - name: Checkout course notes
        uses: actions/checkout@v4
        with:
          repository: LUNARKN1GHT/USTC-AI-Notes
          ref: main
          path: .build/notes

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .build/notes/requirements-docs.txt

      - name: Install notes dependencies
        run: python -m pip install -r .build/notes/requirements-docs.txt

      - name: Build personal site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Build notes under /notes
        run: |
          python .build/notes/scripts/prepare_docs.py
          python -m mkdocs build \
            --config-file .build/notes/mkdocs.yml \
            --site-dir "${{ github.workspace }}/_site/notes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
